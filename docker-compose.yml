services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  api:
    build: ./Backend
    ports: ["3000:3000"]
    env_file: [./Backend/.env]
    depends_on: [mongo]
  web:
    build: ./Frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  mongo-data:
