name: Feature request
description: Suggest an improvement for SafeTour
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What problem should this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: Describe the desired behavior. }
    validations: { required: true }
